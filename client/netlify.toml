[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/customer-auth"
  status = 200

[[redirects]]
  from = "/api/checkout/confirm"
  to = "/.netlify/functions/checkout-confirm"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
